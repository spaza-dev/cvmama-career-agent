<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none">
  <!-- Brand Logo: cvmama with graduation cap motif -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&amp;display=swap');
      .logo-text {
        font-family: 'Outfit', sans-serif;
        font-size: 52px;
        font-weight: 600;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>
  
  <!-- Graduation Cap perched over the V -->
  <g transform="translate(68, 14)">
    <!-- Mortarboard Diamond -->
    <polygon points="26,4 52,14 26,24 0,14" fill="#ffffff" />
    <!-- Skullcap underneath -->
    <path d="M12,18.5 L12,25.5 C12,30 40,30 40,25.5 L40,18.5 Z" fill="#ffffff" opacity="0.9" />
    <!-- Tassel -->
    <path d="M26,14 L37,21 L37,30" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="37" cy="31" r="2.2" fill="#ffffff" />
  </g>

  <!-- Wordmark "CVmama" -->
  <text x="14" y="74" class="logo-text">CVmama</text>
</svg>
