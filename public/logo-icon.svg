<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Rounded Square Teal Background matching user uploaded logo -->
  <rect width="120" height="120" rx="24" fill="#52b1cc" />
  
  <!-- Graduation Cap emblem -->
  <g transform="translate(60, 48)">
    <polygon points="0,-16 28,-5 0,6 -28,-5" fill="#ffffff" />
    <path d="M-15,0 L-15,7 C-15,13 15,13 15,7 L15,0 Z" fill="#ffffff" opacity="0.95" />
    <path d="M0,-5 L13,3 L13,14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="13" cy="15" r="2" fill="#ffffff" />
  </g>

  <!-- Stylized "cvmama" text in Outfit -->
  <text x="60" y="86" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="24" fill="#ffffff" letter-spacing="-0.5px">cvmama</text>
